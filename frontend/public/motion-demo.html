<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>交互动效演示</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#101828;background:#f8fafc}*{box-sizing:border-box}body{margin:0}main{max-width:430px;margin:auto;padding:36px 20px;background:white;min-height:100dvh}h1{font-size:24px;font-weight:600}p{font-size:15px;line-height:1.7;color:#667085}button{min-height:46px;padding:11px 18px;background:#185bff;color:white;border:0;border-radius:10px;font:inherit;cursor:pointer;transition:transform 180ms,background-color 180ms}button:active{transform:scale(.98)}button:focus-visible{outline:2px solid #185bff;outline-offset:3px}.demo-row{padding:16px 0;border-bottom:1px solid #e4e9f0}.secondary{background:#f2f4f7;color:#101828}dialog{padding:22px 20px;width:min(100%,430px);max-height:90dvh;overflow:auto;border:0;border-radius:20px 20px 0 0;position:fixed;inset:auto 0 0;margin:0 auto;animation:sheet-enter 200ms cubic-bezier(.16,1,.3,1)}dialog::backdrop{background:rgba(16,24,40,.36)}dialog h2{text-align:center;font-size:22px;font-weight:600}dialog button{display:block;width:100%;margin-top:12px}.grip{width:40px;height:5px;background:#ccd2dc;border-radius:5px;margin:0 auto 24px}@keyframes sheet-enter{from{opacity:.6;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style><main><h1>交互动效演示</h1><p>演示同版界面的轻按压与底部弹层。此页不连接账户、不发起录音或交易；真实录音与成功状态仅由主应用服务结果触发。</p><section class="demo-row"><p>按钮按压 · 180ms</p><button>按住看看</button></section><section class="demo-row"><p>弹层出现 · 200ms</p><button id="open">打开核查提醒</button></section><p>系统开启“减少动态效果”后，演示自动关闭动画。</p><a href="./">返回实际应用</a></main><dialog id="sheet"><div class="grip"></div><h2>转账前，再核实一下</h2><p>这是动效示例。实际应用列出本笔交易真实触发的原因，用户可继续核对或返回修改。</p><button id="close">继续核对 · 关闭演示</button><button class="secondary" id="back">返回修改 · 关闭演示</button></dialog><script>const sheet=document.getElementById('sheet');document.getElementById('open').onclick=()=>sheet.showModal();for(const id of ['close','back'])document.getElementById(id).onclick=()=>sheet.close();sheet.onclick=e=>{if(e.target===sheet&&e.clientY<sheet.getBoundingClientRect().top)sheet.close()}</script></html>
