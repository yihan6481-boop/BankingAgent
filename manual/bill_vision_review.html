<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>上传账单 · 专用核对验收页</title>
<style>
body{font:16px system-ui,sans-serif;color:#172b35;background:#f4f7f8;margin:24px auto;max-width:1200px;padding:0 20px}section{background:white;border:1px solid #dce4e7;border-radius:12px;padding:20px;margin:16px 0}button,input,select,textarea{font:inherit;padding:8px;margin:4px}button{background:#135c70;color:white;border:0;border-radius:6px;cursor:pointer}button:disabled{opacity:.45}textarea{width:96%;height:180px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f4f5;padding:12px}img{max-width:400px;max-height:420px}label{display:inline-block}#status{position:sticky;top:0;background:#e6f1f3;padding:12px;white-space:pre-wrap;z-index:1}.row{border-top:1px solid #dce4e7;margin-top:12px;padding-top:12px}small{color:#4f6470}input[type=number]{width:140px}.evidence{white-space:pre-wrap}
</style>
<style>.review-control{display:inline-flex;align-items:center;gap:8px;border:1px solid #c7d8df;border-radius:6px;background:#f5f9fa;padding:8px 12px;margin:4px 16px 12px 0}.review-control input{margin:0}</style>
<h1>上传账单核对</h1><p>专用手工验收页。仅支持微信/支付宝 JPEG、PNG 单张图片；最多10MiB、2000万像素。上传记录独立于银行流水，确认导入不授权付款。</p>
<div id="status" role="status">请登录</div>
<section><h2>1 · 登录</h2><label>账号<input id="username" autocomplete="username"></label><label>密码<input id="password" type="password" autocomplete="current-password"></label><button id="login">登录</button></section>
<section><h2>2 · 上传与识别</h2><input type="file" id="file" accept="image/png,image/jpeg"><button id="upload">上传一张</button><button id="recognize">真实识别</button><button id="list">刷新本人批次</button><select id="docs" aria-label="本人上传批次"></select><button id="select">读取并选择</button><div><img id="image" alt="当前本人上传的原图"></div></section>
<section><h2>3 · 逐项核对</h2><p>金额为整数分；日期须有明确年份。请解决所有字段疑点；排除不需要的行。保存编辑后须重新确认当前行集合，旧确认失效。</p><label>平台<select id="platform"><option value="wechat">微信</option><option value="alipay">支付宝</option></select></label><div id="rows"></div><button id="edit">保存核对修改</button><button id="confirm">确认导入已核对账单</button><details><summary>原识别值、疑点、版本与摘要</summary><pre id="detail"></pre></details></section>
<section><h2>4 · 查询与删除</h2><button id="query">查询当前批次已确认记录</button><input id="message" style="width:65%" value="刚上传的账单里支出一共多少？" aria-label="聊天问题"><button id="chat">通过原 secure 聊天查询</button><button id="versions">读取修订</button><button id="delete">删除当前账单及原图</button><pre id="result"></pre></section>
<script>
'use strict';let sid=null,current=null,imageUrl=null,busy=false;const $=id=>document.getElementById(id);
async function api(path,options={}){if(!sid)throw Error('请先登录');let h={Authorization:'Bearer '+sid,...options.headers};if(options.json!==undefined){h['Content-Type']='application/json';options.body=JSON.stringify(options.json);delete options.json}let r=await fetch('/api/secure/sessions/'+sid+path,{...options,headers:h,cache:'no-store'});let v=await r.json();if(!r.ok){const code=v.error?.code;const detail=v.error?.message||(typeof v.detail==='string'?v.detail:Array.isArray(v.detail)?v.detail.map(x=>x.loc.join('.')+'：'+x.msg).join('；'):v.message||JSON.stringify(v));throw Error((code?code+'：':'')+detail)}return v.data??v}
function setBusy(value){busy=value;document.body.setAttribute('aria-busy',String(value));document.querySelectorAll('button,input,select,textarea').forEach(x=>x.disabled=value)}
const operationNames={login:'登录',upload:'上传图片',recognize:'识别图片',list:'读取本人批次',select:'读取所选账单',edit:'保存核对修改',confirm:'确认导入',query:'查询',chat:'聊天查询',versions:'读取修订',delete:'删除账单'};
function bind(id,fn){$(id).onclick=async()=>{if(busy)return;setBusy(true);$('status').textContent='正在'+operationNames[id]+'，请等待完成后再修改。';try{const message=await fn();$('status').textContent=message||operationNames[id]+'成功'}catch(e){$('status').textContent=operationNames[id]+'失败：'+e.message}finally{setBusy(false)}}}
function stable(value){if(Array.isArray(value))return '['+value.map(stable).join(',')+']';if(value&&typeof value==='object')return '{'+Object.keys(value).sort().map(k=>JSON.stringify(k)+':'+stable(value[k])).join(',')+'}';return JSON.stringify(value)}
function unresolved(d){let reasons=[];for(const row of d.rows){if(!row.included||row.duplicate_resolution==='exclude')continue;if(!row.reviewed)reasons.push(row.row_id+'：未勾选“已逐项核对”');if(d.issues[row.row_id]?.length)reasons.push(row.row_id+'：未解决疑点（'+d.issues[row.row_id].join('、')+'）')}if(d.platform==='unknown')reasons.push('来源平台尚未核实');return reasons}
document.addEventListener('input',e=>{if(!busy&&current&&e.target.closest('#rows'))$('status').textContent='核对内容尚未保存；当前勾选只在页面中，请点击“保存核对修改”并等待回读完成。'});
function add(parent,tag,text){let e=document.createElement(tag);e.textContent=text;parent.append(e);return e}
function paint(d){current=d;$('platform').value=d.platform==='unknown'?'wechat':d.platform;$('rows').replaceChildren();$('detail').textContent=JSON.stringify(d,null,2);for(let row of d.rows){let box=add($('rows'),'div','');box.className='row';box.dataset.id=row.row_id;add(box,'h3',row.row_id);let label=add(box,'label','');label.className='review-control';let inc=add(label,'input','');inc.type='checkbox';inc.checked=row.included;inc.dataset.field='included';inc.setAttribute('aria-label',row.row_id+' 纳入导入');label.append(document.createTextNode('纳入导入'));let checked=add(box,'label','');checked.className='review-control';let rev=add(checked,'input','');rev.type='checkbox';rev.checked=row.reviewed;rev.dataset.field='reviewed';rev.setAttribute('aria-label',row.row_id+' 已逐项核对');checked.append(document.createTextNode('已逐项核对'));for(let field of ['date','time','precision','merchant','amount_cents','currency','direction','kind','status','payment_method','order_number','event_number']){let l=add(box,'label',field);let i=add(l,'input','');i.value=row.value[field]??'';i.dataset.field=field;if(field==='amount_cents')i.type='number'}let dupl=add(box,'label','重复处理');let se=add(dupl,'select','');se.dataset.field='duplicate_resolution';for(let [v,t] of [['unresolved','未处理'],['keep_distinct','核实为不同交易'],['exclude','排除此行']]){let o=add(se,'option',t);o.value=v}se.value=row.duplicate_resolution;let evidence=add(box,'p','图片证据：'+row.value.evidence);evidence.className='evidence';add(box,'p','当前疑点：'+JSON.stringify(d.issues[row.row_id])+'；重复提示：'+JSON.stringify(d.duplicates[row.row_id]));let l=add(box,'label','未解决疑点（每行一项，核实解决后清空）');let issues=add(l,'textarea','');issues.dataset.field='issues';issues.value=row.value.issues.join('\n')}if(busy)setBusy(true)}
function editedRows(){return current.rows.map(row=>{let value={...row.value};let box=[...$('rows').children].find(x=>x.dataset.id===row.row_id);for(let i of box.querySelectorAll('input[data-field]')){let f=i.dataset.field;if(['included','reviewed'].includes(f))continue;value[f]=i.value===''?null:f==='amount_cents'?Number(i.value):i.value}value.issues=box.querySelector('[data-field=issues]').value.split('\n').filter(x=>x.trim());return {...row,value,included:box.querySelector('[data-field=included]').checked,reviewed:box.querySelector('[data-field=reviewed]').checked,duplicate_resolution:box.querySelector('[data-field=duplicate_resolution]').value}})}
async function showImage(){if(imageUrl)URL.revokeObjectURL(imageUrl);let r=await fetch('/api/secure/sessions/'+sid+'/bills/'+current.document_id+'/image',{headers:{Authorization:'Bearer '+sid},cache:'no-store'});if(!r.ok)throw Error('读取原图失败');imageUrl=URL.createObjectURL(await r.blob());$('image').src=imageUrl}
function doc(){if(!current)throw Error('请先上传或选择批次');return '/bills/'+current.document_id}
bind('login',async()=>{let r=await fetch('/api/v2/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});let v=await r.json();if(!r.ok)throw Error('登录失败');sid=v.session_id;current=null;$('rows').replaceChildren();$('result').textContent='';$('detail').textContent='';$('image').removeAttribute('src');$('password').value=''});
bind('upload',async()=>{let f=$('file').files[0];if(!f)throw Error('请选择图片');paint(await api('/bills',{method:'POST',body:f,headers:{'Content-Type':'application/octet-stream'}}));await showImage()});
bind('recognize',async()=>paint(await api(doc()+'/recognize',{method:'POST',json:{revision:current.revision}})));
bind('list',async()=>{let d=await api('/bills');$('docs').replaceChildren();for(let row of d.documents){let o=add($('docs'),'option',row.document_id+' · '+row.state+' · r'+row.revision);o.value=row.document_id}});
bind('select',async()=>{paint(await api('/bills/'+$('docs').value+'/select',{method:'POST'}));await showImage()});
bind('edit',async()=>{
    const path=doc(),revision=current.revision,rows=editedRows(),platform=$('platform').value;
    const saved=await api(path+'/rows',{method:'PUT',json:{revision,platform,rows}});
    const fresh=await api(path);
    if(saved.document_id!==fresh.document_id||fresh.revision!==saved.revision||stable(saved.rows)!==stable(rows)||stable(fresh.rows)!==stable(rows)||fresh.platform!==platform){
        throw Error('服务器保存响应或GET回读与本次核对内容不一致，未确认导入；请重新读取当前批次核对，不能把页面勾选当作已保存。');
    }
    paint(fresh);const reasons=unresolved(fresh);
    return '已保存并GET回读核验：revision '+revision+'→'+fresh.revision+'；'+fresh.rows.map(r=>r.row_id+' reviewed='+r.reviewed).join('，')+'。'+(reasons.length?'尚不能确认：'+reasons.join('；'):'已纳入行的核对标记和必要字段已就绪，请明确确认导入。');
});
bind('confirm',async()=>{if(stable(editedRows())!==stable(current.rows))throw Error('页面存在尚未保存的核对修改；请先保存并等待GET回读完成，再确认');paint(await api(doc()+'/confirm',{method:'POST',json:{revision:current.revision,digest:current.digest,row_ids:current.rows.filter(x=>x.included&&x.duplicate_resolution!=='exclude').map(x=>x.row_id),text:'确认导入已核对账单'}}));return '确认导入成功：state='+current.state+'，revision='+current.revision+'；这是本人资料导入，不是付款授权。'});
bind('query',async()=>{$('result').textContent=JSON.stringify(await api('/bills/query',{method:'POST',json:{document_id:current.document_id}}),null,2)});
bind('chat',async()=>{$('result').textContent=JSON.stringify(await api('/chat',{method:'POST',json:{message:$('message').value,intent_mode:'analysis'}}),null,2)});
bind('versions',async()=>{$('result').textContent=JSON.stringify(await api(doc()+'/versions'),null,2)});
bind('delete',async()=>{await api(doc()+'?revision='+current.revision,{method:'DELETE'});current=null;$('rows').replaceChildren();$('detail').textContent='';$('result').textContent='已删除；当前查询、版本和图片不再可读';$('image').removeAttribute('src');if(imageUrl)URL.revokeObjectURL(imageUrl)});
</script></html>
